name: TICS

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tics:
    name: TICS
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted-linux-amd64-noble-tiobe
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and linters
        run: pip install tox flake8 pylint -r requirements.txt
      - name: Run unit tests with coverage
        run: |
          tox -e unit,coverage-report
          rm -rf .tox .coverage
          mkdir .coverage
          mv coverage.xml .coverage/cobertura.xml
      - name: TICS GitHub Action
        uses: tiobe/tics-github-action@v3
        with:
          mode: qserver
          project: tmate-ssh-server-operator
          branchdir: ${{ github.workspace }}
          viewerUrl: https://canonical.tiobe.com/tiobeweb/TICS/api/cfg?name=default
          ticsAuthToken: ${{ secrets.TICSAUTHTOKEN }}
          installTics: true

concurrency:
  group: tics
  cancel-in-progress: false
