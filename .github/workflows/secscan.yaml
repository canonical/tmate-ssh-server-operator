# Scans the published tmate-ssh-server charm and the OCI image it runs with Canonical
# secscan to meet SEC0025. Called after each publish to edge, and run weekly.
name: Secscan

on:
  schedule:
    - cron: "35 4 * * 1"
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/secscan.yaml
      - .github/secscan-exclusions/**

permissions: {}

env:
  SSDLC_CYCLE: "26.10"

jobs:
  secscan:
    name: Secscan ${{ matrix.artifact }}
    # Fork PRs must never reach private-endpoint runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted-linux-amd64-noble-private-endpoint-medium]
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: charm-edge-22.04, kind: charm, channel: latest/edge, base: ubuntu@22.04, ssdlc-channel: edge }
          - { artifact: charm-edge-24.04, kind: charm, channel: latest/edge, base: ubuntu@24.04, ssdlc-channel: edge }
          - { artifact: charm-stable-22.04, kind: charm, channel: latest/stable, base: ubuntu@22.04, ssdlc-channel: stable }
          - { artifact: image, kind: image, ssdlc-channel: edge }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install secscan client
        run: |
          sudo snap install canonical-secscan-client
          sudo snap connect canonical-secscan-client:home system:home
          mkdir -p "$HOME/snap/canonical-secscan-client/common"
          echo "SECSCAN_DIR=$HOME/snap/canonical-secscan-client/common" >> "$GITHUB_ENV"
          echo "NO_PROXY=${NO_PROXY:+$NO_PROXY,}.internal" >> "$GITHUB_ENV"
          echo "no_proxy=${no_proxy:+$no_proxy,}.internal" >> "$GITHUB_ENV"
      - name: Download charm
        id: charm
        if: matrix.kind == 'charm'
        env:
          CHANNEL: ${{ matrix.channel }}
          BASE: ${{ matrix.base }}
        run: |
          sudo snap install juju --channel=3.6/stable
          mkdir -p charm && cd charm
          juju download tmate-ssh-server --channel "$CHANNEL" --base "$BASE" --no-progress
          shopt -s nullglob; files=(*.charm)
          [[ ${#files[@]} -eq 1 ]] || { echo "::error::expected one charm, found ${#files[@]}"; exit 1; }
          [[ "${files[0]}" =~ _r([0-9]+)\.charm$ ]] || { echo "::error::no revision in ${files[0]}"; exit 1; }
          cp "${files[0]}" "$SECSCAN_DIR/"
          echo "target=$SECSCAN_DIR/${files[0]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Resolve image
        id: image
        if: matrix.kind == 'image'
        run: |
          image="$(grep -oE 'ghcr\.io/canonical/tmate-ssh-server:[^[:space:]]+' templates/tmate-ssh-server.service.j2 | sort -u || true)"
          [[ -n "$image" && "$image" != *$'\n'* ]] || { echo "::error::expected exactly one image reference in template, found: ${image:-none}"; exit 1; }
          echo "target=$image" >> "$GITHUB_OUTPUT"
          echo "version=${image##*:}" >> "$GITHUB_OUTPUT"
      - name: Scan
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TARGET: ${{ steps.charm.outputs.target || steps.image.outputs.target }}
          SSDLC_VERSION: ${{ steps.charm.outputs.version || steps.image.outputs.version }}
          SSDLC_CHANNEL: ${{ matrix.ssdlc-channel }}
          SCAN_TYPE: ${{ matrix.kind == 'charm' && 'package' || 'container-image' }}
          SCAN_FORMAT: ${{ matrix.kind == 'charm' && 'charm' || 'oci' }}
        run: |
          select_exclusions() {  # $1 artifact name, $2 staging dir; prints staged path or nothing
            local src=".github/secscan-exclusions/$1.txt"
            if [[ -f "$src" ]] && grep -qvE '^[[:space:]]*(#|$)' "$src"; then
              cp "$src" "$2/exclusions-$1.txt"; echo "$2/exclusions-$1.txt"
            fi
          }
          classify() {  # $1 secscan-client --batch exit code; echoes annotation, returns it
            case "$1" in
              0) echo "No CVEs found." ;;
              101) echo "::error::Excluded CVEs are no longer reported; remove them from .github/secscan-exclusions/." ;;
              1[0-9][0-9]) echo "::error::CVEs found; the secscan-report artifact's <artifact>.txt lists them; triage per SECURITY.md." ;;
              *) echo "::error::secscan-client failed (exit $1); re-run the job." ;;
            esac
            return "$1"
          }
          mkdir -p reports
          exclusions=()
          excl_file="$(select_exclusions "$ARTIFACT" "$SECSCAN_DIR")"
          [[ -n "$excl_file" ]] && exclusions=(--exclusions-filename "$excl_file")
          set +e
          secscan-client --batch submit \
            --scanner trivy --type "$SCAN_TYPE" --format "$SCAN_FORMAT" \
            --ssdlc-product-name github-runner \
            --ssdlc-product-version "$SSDLC_VERSION" \
            --ssdlc-product-channel "$SSDLC_CHANNEL" \
            --ssdlc-cycle "$SSDLC_CYCLE" \
            --token "$SECSCAN_DIR/$ARTIFACT.token" \
            "${exclusions[@]}" \
            --wait-and-print "$TARGET" | tee "reports/$ARTIFACT.txt"
          rc=${PIPESTATUS[0]}
          if (( rc == 0 || rc >= 100 )); then secscan-client --batch report --token "$SECSCAN_DIR/$ARTIFACT.token" > "reports/$ARTIFACT.report.html" 2> "reports/$ARTIFACT.report.err" || true; fi
          set -e
          classify "$rc"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secscan-report-${{ matrix.artifact }}
          path: reports/
          if-no-files-found: warn
