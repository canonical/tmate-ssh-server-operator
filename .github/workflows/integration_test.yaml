name: Integration tests

on:
  pull_request:
  schedule:
  - cron: "0 15 * * SAT"

jobs:
  integration-tests:
    uses:
      canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    permissions:
      contents: read
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      juju-channel: 3.6/stable
      provider: lxd
      pre-run-script: |
        -c "chmod +x tests/integration/pre_run_script.sh
        ./tests/integration/pre_run_script.sh"
      runs-on: ubuntu-24.04
      modules: '["test_charm", "test_proxy", "test_upgrade"]'
  allure-report:
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: integration-tests
    permissions:
      contents: write
    uses: canonical/operator-workflows/.github/workflows/allure_report.yaml@main
